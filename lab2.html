<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Булевы операции (AND, OR, XOR)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
        }
        .navbar {
            background-color: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 20px;
        }
        .navbar a {
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
            font-size: 16px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            font-size: 18px;
        }
        input[type="number"] {
            padding: 8px;
            font-size: 16px;
            width: 100px;
            margin-left: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #d0d0d0;
        }
        .result {
            margin-top: 30px;
            font-size: 20px;
            display: none;
        }
        .calc-steps {
            margin-top: 20px;
            font-size: 18px;
            color: #555;
            line-height: 1.8;
        }
        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #0056b3;
            text-decoration: none;
            font-size: 16px;
        }
        .footer {
            margin-top: 60px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="index.html">Главная</a>
        <a href="#">Контакты</a>
    </div>

    <div class="container">
        <h1>Булевы операции (AND, OR, XOR)</h1>
        <p>Введите два числа (0 или 1) для выполнения логических операций</p>
        
        <div class="form-group">
            <label for="x">X (первое число):</label>
            <input type="number" id="x" min="0" max="1" value="1">
        </div>
        <div class="form-group">
            <label for="y">Y (второе число):</label>
            <input type="number" id="y" min="0" max="1" value="0">
        </div>
        
        <button onclick="calculate()">Выполнить операции</button>

        <div class="result" id="result-box">
            <p><strong>Результаты:</strong></p>
            <div class="calc-steps" id="steps"></div>
        </div>

        <a href="index.html" class="back-link">← Вернуться на главную</a>

        <div class="footer">
            <p>Web hosting by Somee.com</p>
            <p>Hosted Windows Virtual Server. 2.5GHz CPU, 2GB RAM, 60GB SSD. Try it now for $1!</p>
            <p>Web hosting by Somee.com</p>
        </div>
    </div>

    <script>
        function calculate() {
            // Получаем значения и переводим их в числа
            const x = parseInt(document.getElementById('x').value) || 0;
            const y = parseInt(document.getElementById('y').value) || 0;

            // Проверка на корректный ввод (только 0 или 1)
            if ((x !== 0 && x !== 1) || (y !== 0 && y !== 1)) {
                alert("Пожалуйста, введите только 0 или 1.");
                return;
            }

            // Выполняем операции
            const andRes = x & y;
            const orRes = x | y;
            const xorRes = x ^ y;

            // Отображаем результаты
            document.getElementById('result-box').style.display = 'block';
            document.getElementById('steps').innerHTML = 
                `${x} & ${y} (AND)<br>= ${andRes}<br><br>` +
                `${x} | ${y} (OR)<br>= ${orRes}<br><br>` +
                `${x} ^ ${y} (XOR)<br>= ${xorRes}`;
        }
    </script>
</body>
</html>
