<!DOCTYPE html>

    <style>
        /* Базовые стили для всей страницы */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Заголовок страницы */
        header {
            width: 100%;
            text-align: center;
            padding: 40px 20px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #222;
            margin: 0;
        }

        /* Блок с фотографией */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Маленькое круглое фото */
        .profile-photo {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%; /* Делает фото круглым */
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: #222;
            margin: 0;
        }

        /* Блок с контактными данными */
        .contact-info {
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: left;
            margin-bottom: 80px; /* Отступ снизу, чтобы не перекрывалось баннером */
        }

        .contact-info h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .contact-info ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .contact-info li {
            font-size: 16px;
            margin-bottom: 8px;
            color: #444;
        }

        .contact-info a {
            color: #444;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        /* Нижняя панель (как на скриншоте) */
        .footer-banner {
            width: 100%;
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 15px;
            font-size: 16px;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 10;
        }
    </style>
</head>
